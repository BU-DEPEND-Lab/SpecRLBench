# Shared recipe for MultiGoalSARLevel* and CustomizedSAR.

# Stock level identity — documented parity with Python classes; not applied at runtime.
levels:
  level0:
    wall_count: 0
    surface_casualties_enabled: true
    entrapped_casualties_enabled: false
    building_num: 0
  level1:
    wall_count: 10
  level2:
    wall_count: 10
    surface_casualties_enabled: false
    entrapped_casualties_enabled: true
  level3:
    wall_count: 10
    surface_casualties_enabled: true
    entrapped_casualties_enabled: true

placements_conf:
  extents: [-3.5, -3.5, 3.5, 3.5]

agent:
  placements: [[-0.67, -0.67, 0.67, 0.67]]
  keepout: 0.25

lidar_conf:
  num_bins: 16
  type: pseudo
  max_dist: null
  exp_gain: 0.5
  alias: true

cost_conf:
  constrain_indicator: false

mechanism_conf:
  continue_goal: false

render_conf:
  lidar_markers: false

observation_flatten: false

reward:
  reward_goal: 1.0

walls:
  ring_radius: 2.0
  margin: 1.0
  base_half_sizes: [0.1, 0.3, 0.2]
  keepout: 0.4
  half_size_randomization: true

buildings:
  keepout: 0.4
  border_side_length: 4.5
  margin: 0.8
  perimeter_walls:
    height: 0.75
    collision_threshold: 8.0

casualtys:
  size: 0.05
  touch_offset: 0.15
  keepout_surface: 0.2
  keepout_entrapped: 0.0

gremlins:
  size: 0.175
  dist_threshold: 0.175
  keepout: 0.0

customized_defaults:
  agent_num: 2
  building_num: null
  wall_count: 10
  surface_casualties_enabled: true
  entrapped_casualties_enabled: false
  reward_goal: 1.0
  lidar_conf:
    num_bins: 16
